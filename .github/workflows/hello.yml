# The name of the workflow. This will be displayed on the GitHub Actions page.
name: Hello World Workflow

# Controls when the workflow will run.
on:
  # Trigger the workflow on push events for any branch.
  push:
    branches:
      - master

  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# A workflow run is made up of one or more jobs.
jobs:
  # This workflow has a single job called 'hello_job'.
  hello_job:
    # The type of runner that the job will run on.
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job.
    steps:
      # Use the 'actions/checkout' action to check out your repository under $GITHUB_WORKSPACE.
      # This is a common first step in many workflows.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Runs a single command using the operating system's shell.
      # This step will simply print "Hello, world!" to the console.
      - name: Run a one-line script
        run: echo "Hello, world!"

      # Runs a set of commands using the operating system's shell.
      # This is an example of a multi-line script.
      - name: Run a multi-line script
        run: |
          echo "This is the first line."
          echo "This is the second line."